<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" id="themeColor" content="#faf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="在家·物品地图">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>🏠 在家 · 物品地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf6f0;--card-bg:#fffbf5;--card-shadow:rgba(180,140,100,.08);--card-hover-shadow:rgba(180,140,100,.18);--text:#4a3728;--text-secondary:#8a7a6a;--accent:#e88965;--accent-light:#fef0e8;--accent-gradient:linear-gradient(135deg,#e88965,#d4a56a);--border:#ece3d8;--border-hover:#e88965;--grid-cell:#faf3ea;--grid-dashed:#e0d5c8;--tag-bg:rgba(255,255,255,.95);--tag-shadow:rgba(180,140,100,.12);--bar-bg:linear-gradient(135deg,#e88965,#c98b5a);--bar-shadow:rgba(232,137,101,.35);--search-bg:#fffbf5;--search-border:#ece3d8;--search-focus:#e88965;--hint-bg:#fff3e0;--hint-text:#bf6f3a;--modal-overlay:rgba(60,40,20,.35);--modal-bg:#fffbf5;--btn-primary:#e88965;--btn-primary-hover:#d47a58;--btn-outline:#e88965;--hover-tip-bg:#fef0e8;--hover-tip-text:#bf6f3a;--hover-tip-success-bg:#f0f5e8;--hover-tip-success-text:#5a8040}
body.night{--bg:linear-gradient(135deg,#0d0a1a,#1a1030 30%,#0f1420 70%,#080c14);--card-bg:rgba(255,255,255,.06);--card-shadow:rgba(0,0,0,.3);--card-hover-shadow:rgba(100,80,180,.25);--text:#e8e0f0;--text-secondary:#9080a8;--accent:#9b7de0;--accent-light:rgba(155,125,224,.12);--accent-gradient:linear-gradient(135deg,#9b7de0,#6b5bcc);--border:rgba(155,125,224,.2);--border-hover:#9b7de0;--grid-cell:rgba(255,255,255,.04);--grid-dashed:rgba(155,125,224,.2);--tag-bg:rgba(255,255,255,.08);--tag-shadow:rgba(0,0,0,.25);--bar-bg:linear-gradient(135deg,#2a1a4a,#1a1030);--bar-shadow:rgba(100,60,180,.3);--search-bg:rgba(255,255,255,.06);--search-border:rgba(155,125,224,.25);--search-focus:#9b7de0;--hint-bg:rgba(155,125,224,.12);--hint-text:#b8a0e8;--modal-overlay:rgba(0,0,0,.55);--modal-bg:#1a1430;--btn-primary:#9b7de0;--btn-primary-hover:#8a6ccf;--btn-outline:#9b7de0;--hover-tip-bg:rgba(155,125,224,.15);--hover-tip-text:#c0a8e8;--hover-tip-success-bg:rgba(100,180,120,.15);--hover-tip-success-text:#80c888}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;transition:background .5s,color .3s;padding-bottom:env(safe-area-inset-bottom,0)}
.floating-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--bar-bg);padding:8px 0;box-shadow:0 4px 20px var(--bar-shadow);overflow:hidden;padding-top:env(safe-area-inset-top,0);height:calc(56px + env(safe-area-inset-top,0));display:flex;align-items:center}
.floating-track{display:flex;gap:12px;animation:scrollLeft 20s linear infinite;white-space:nowrap;padding:0 8px}
.floating-track:hover{animation-play-state:paused}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.item-tag{display:inline-flex;align-items:center;gap:6px;background:var(--tag-bg);border-radius:100px;padding:6px 16px 6px 10px;font-size:13px;font-weight:500;color:var(--text);box-shadow:0 2px 8px var(--tag-shadow);cursor:grab;user-select:none;transition:transform .15s,box-shadow .15s,background .3s;flex-shrink:0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
.item-tag:active{cursor:grabbing;transform:scale(.95)}
.item-tag .icon{font-size:16px}
.item-tag .close{font-size:12px;color:var(--text-secondary);cursor:pointer;padding:2px;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.item-tag .close:hover{background:rgba(0,0,0,.08);color:var(--text)}
.item-tag.dragging{opacity:.5;transform:scale(.9)}
.empty-hint{position:fixed;top:calc(56px + env(safe-area-inset-top,0));left:0;right:0;background:var(--hint-bg);color:var(--hint-text);text-align:center;padding:6px;font-size:13px;z-index:999;border-bottom:1px solid rgba(0,0,0,.06)}
.container{max-width:800px;margin:0 auto;padding:80px 16px 100px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.header h1{font-size:22px;font-weight:700}
.header .actions{display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--btn-primary);color:#fff}
.btn-primary:hover{background:var(--btn-primary-hover)}
.btn-outline{background:transparent;color:var(--btn-outline);border:1.5px solid var(--btn-outline)}
.btn-outline:hover{background:var(--accent-light)}
.btn-theme{background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);font-size:18px;padding:6px 12px}
.search-bar{margin-bottom:18px}
.search-bar input{width:100%;padding:10px 16px;border-radius:20px;border:1.5px solid var(--search-border);background:var(--search-bg);font-size:14px;color:var(--text);outline:none}
.search-bar input:focus{border-color:var(--search-focus)}
.search-bar input::placeholder{color:var(--text-secondary)}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.room-card{background:var(--card-bg);border-radius:14px;padding:18px 10px 14px;text-align:center;box-shadow:0 2px 8px var(--card-shadow);cursor:pointer;transition:all .2s,background .3s;border:2px solid transparent;position:relative;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);user-select:none}
.room-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--card-hover-shadow)}
.room-card.active{border-color:var(--accent);background:var(--accent-light)}
.room-card.drag-hover{border-color:var(--accent);background:var(--accent-light);transform:scale(1.03);box-shadow:0 6px 24px var(--card-hover-shadow)}
.room-card[data-highlight="true"]{background:var(--accent-light)!important;border-color:var(--accent)!important}
.room-card .room-icon{font-size:28px;margin-bottom:4px}
.room-card .room-name{font-size:13px;font-weight:500}
.room-card .room-count{font-size:11px;color:var(--text-secondary);margin-top:2px}
.room-card .hover-tip{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);background:var(--hover-tip-bg);color:var(--hover-tip-text);font-size:11px;padding:2px 10px;border-radius:8px;white-space:nowrap;animation:fadeIn .2s;z-index:50;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.room-card .hover-tip.success{background:var(--hover-tip-success-bg);color:var(--hover-tip-success-text)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
body.swap-mode .room-card{cursor:pointer}
body.swap-mode .room-card:hover{border-color:var(--accent);background:var(--accent-light)}
.room-card.swap-source{border-color:#4caf50!important;background:#e8f5e9!important;transform:scale(1.06)}
.room-card.swap-target{border-color:#2196f3!important;background:#e3f2fd!important}
body.night .room-card.swap-source{border-color:#66bb6a!important;background:rgba(76,175,80,.2)!important}
body.night .room-card.swap-target{border-color:#42a5f5!important;background:rgba(33,150,243,.15)!important}
.room-detail{background:var(--card-bg);border-radius:16px;padding:16px;box-shadow:0 2px 12px var(--card-shadow);margin-bottom:20px;animation:slideDown .25s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.room-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.room-detail-header h2{font-size:18px}
.room-detail-header .back{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 12px;border-radius:12px;background:var(--accent-light)}
.grid-map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-cell{aspect-ratio:1;background:var(--grid-cell);border:2px dashed var(--grid-dashed);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer;transition:all .15s;position:relative;min-height:80px}
.grid-cell:hover{border-color:var(--border-hover);background:var(--accent-light)}
.grid-cell.drag-over{border-color:var(--accent);background:var(--accent-light);transform:scale(1.05);box-shadow:0 0 0 3px var(--accent-light)}
.grid-cell .cell-label{font-size:11px;font-weight:600;color:var(--text-secondary);position:absolute;top:4px;left:6px}
.grid-cell .cell-item{font-size:13px;font-weight:500;color:var(--text);text-align:center;word-break:break-all}
.grid-cell .cell-item .emoji{font-size:22px;display:block;margin-bottom:2px}
.grid-cell.full{border-style:solid;border-color:var(--border);background:var(--card-bg)}
.grid-cell .remove-item{position:absolute;top:2px;right:4px;font-size:12px;color:var(--text-secondary);cursor:pointer;background:var(--card-bg);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:10}
.grid-cell:hover .remove-item{opacity:1}
.grid-cell .remove-item:hover{color:#d46050;background:rgba(212,96,80,.12)}
body.night .grid-cell .remove-item:hover{color:#c088d0;background:rgba(155,125,224,.2)}
.add-btn{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:28px;background:var(--accent-gradient);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px var(--bar-shadow);transition:transform .15s;z-index:100;bottom:calc(24px + env(safe-area-inset-bottom,0))}
.add-btn:hover{transform:scale(1.1)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--modal-bg);border-radius:20px;padding:24px;width:90%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h3{font-size:18px;margin-bottom:16px}
.modal label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px}
.modal input,.modal select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;background:var(--search-bg);color:var(--text)}
.modal input:focus,.modal select:focus{border-color:var(--search-focus)}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.modal .modal-actions button{padding:10px 20px;border-radius:12px;border:none;font-size:14px;cursor:pointer}
.modal .btn-cancel{background:rgba(0,0,0,.06);color:var(--text-secondary)}
.modal .btn-confirm{background:var(--btn-primary);color:#fff}
.offline-banner{display:none;position:fixed;bottom:88px;left:16px;right:16px;background:#ffcc02;color:#8b6914;text-align:center;padding:8px;border-radius:12px;font-size:13px;font-weight:500;z-index:90;bottom:calc(88px + env(safe-area-inset-bottom,0))}
@media(max-width:480px){.room-grid{gap:8px}.room-card{padding:14px 6px 12px}.grid-map{gap:6px}.grid-cell{min-height:64px}.container{padding:72px 12px 90px}}
</style>
</head>
<body>

<div class="floating-bar" id="floatingBar" style="display:none">
  <div class="floating-track" id="floatingTrack"></div>
</div>
<div class="empty-hint" id="emptyHint">💡 双击房间改名 · 长按房间互换 · 拖物品进房间</div>

<div class="container">
  <div class="header">
    <h1>🏠 我的家</h1>
    <div class="actions">
      <button class="btn btn-theme" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button class="btn btn-outline" onclick="shareToFamily()">👨‍👩‍👧 分享</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="search" placeholder="🔍 搜物品，高亮所在房间..." id="searchInput" oninput="searchItems()">
  </div>

  <div class="section-title">📌 房间 · 共<span id="totalItems">0</span>件物品</div>
  <div class="room-grid" id="roomGrid"></div>

  <div id="roomDetailWrap" style="display:none">
    <div class="room-detail">
      <div class="room-detail-header">
        <h2 id="detailRoomName">储物间</h2>
        <span class="back" onclick="closeRoomDetail()">← 收起</span>
      </div>
      <div class="grid-map" id="gridMap"></div>
    </div>
  </div>
</div>

<button class="add-btn" onclick="openAddModal()">＋</button>
<div class="offline-banner" id="offlineBanner">📡 当前离线，数据仅保存在本地</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>📦 新增物品</h3>
    <label>物品名称</label>
    <input type="text" id="newItemName" placeholder="例：螺丝刀套装">
    <label>所属房间</label>
    <select id="newItemRoom"></select>
    <label>格子编号</label>
    <select id="newItemCell"></select>
    <label>图标（选填）</label>
    <input type="text" id="newItemIcon" placeholder="🔧">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">取消</button>
      <button class="btn-confirm" onclick="confirmAdd()">确定</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_ROOMS=[{id:'entrance',name:'玄关',icon:'🚪'},{id:'living',name:'客厅',icon:'🛋️'},{id:'balcony',name:'阳台',icon:'🌿'},{id:'kitchen',name:'厨房',icon:'🍳'},{id:'hallway',name:'走廊',icon:'🚶'},{id:'bathroom',name:'卫生间',icon:'🚿'},{id:'bedroom2',name:'次卧',icon:'🛌'},{id:'bedroom1',name:'主卧',icon:'🛏️'},{id:'storage',name:'储物间',icon:'📦'}];
const CL=['A1','A2','A3','A4','B1','B2','B3','B4','C1','C2','C3','C4','D1','D2','D3','D4'];
let rooms,storage={},floatingItems=[{id:'f1',name:'充电宝',icon:'🔋'},{id:'f2',name:'扳手',icon:'🔧'},{id:'f3',name:'蓝牙耳机',icon:'🎧'},{id:'f4',name:'新买的台灯',icon:'💡'}];
let currentRoom=null,draggedItemData=null,isNight=0,swapSrc=null;

if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.addEventListener('online',()=>{document.getElementById('offlineBanner').style.display='none'});
window.addEventListener('offline',()=>{document.getElementById('offlineBanner').style.display='block'});

function sv(){try{localStorage.setItem('##',JSON.stringify({storage,floatingItems,rooms}))}catch(e){}}
function ld(){
  try{const r=localStorage.getItem('##');if(!r)return 0;const d=JSON.parse(r);if(d.storage)storage=d.storage;if(d.floatingItems)floatingItems=d.floatingItems;rooms=d.rooms?d.rooms:DEFAULT_ROOMS.map(x=>({...x}));return 1}catch(e){return 0}
}
function pa(fn){fn();sv();rr();rf();upd();if(currentRoom)rmg(currentRoom)}

function init(){
  if(!ld()){
    storage={storage:{A1:{name:'工具箱',icon:'🔧'},A2:{name:'露营灯',icon:'💡'},B1:{name:'网线',icon:'🔌'},B2:{name:'创可贴',icon:'🩹'},C1:{name:'鞋盒×3',icon:'📦'}},kitchen:{A1:{name:'炒锅',icon:'🍳'},B2:{name:'调味架',icon:'🧂'}},living:{A2:{name:'遥控器',icon:'📺'},B3:{name:'指甲刀',icon:'✂️'}}};
    rooms=DEFAULT_ROOMS.map(x=>({...x}));sv();
  }
  rr();rf();upd();
}
function toggleTheme(){isNight=!isNight;document.body.classList.toggle('night',isNight);document.getElementById('themeBtn').textContent=isNight?'☀️':'🌙';const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=isNight?'#0d0a1a':'#faf6f0'}

function rr(){
  const g=document.getElementById('roomGrid');g.innerHTML='';
  rooms.forEach((r,i)=>{
    const c=storage[r.id]?Object.keys(storage[r.id]).length:0;
    const cd=document.createElement('div');
    cd.className='room-card';cd.dataset.roomId=r.id;cd.dataset.index=i;
    cd.innerHTML='<div class="room-icon">'+r.icon+'</div><div class="room-name">'+r.name+'</div><div class="room-count">'+c+' 件</div>';
    cd.onclick=function(){openRoomDetail(r)};
    cd.ondblclick=function(e){e.stopPropagation();const n=prompt('新房间名：',r.name);if(n&&n.trim()){r.name=n.trim();sv();rr();if(currentRoom&&currentRoom.id===r.id)openRoomDetail(r)}};

    // 长按 -> 互换模式
    let lpt=null;
    cd.addEventListener('pointerdown',function(e){
      if(swapSrc)return;
      lpt=setTimeout(function(){
        if(swapSrc)return;
        swapSrc=r.id;document.body.classList.add('swap-mode');cd.classList.add('swap-source');
        document.getElementById('emptyHint').textContent='✋ 点另一个房间互换 · 点当前房间取消';
      },600);
    });
    cd.addEventListener('pointerup',function(){if(lpt){clearTimeout(lpt);lpt=null}});
    cd.addEventListener('pointerleave',function(){if(lpt){clearTimeout(lpt);lpt=null}});

    // 互换模式点击
    cd.addEventListener('click',function(e){
      if(!swapSrc)return;e.stopPropagation();
      const si=rooms.findIndex(x=>x.id===swapSrc),ti=rooms.findIndex(x=>x.id===r.id);
      if(si===-1||ti===-1||si===ti){cancelSwap();return}
      const t=rooms[si];rooms[si]=rooms[ti];rooms[ti]=t;sv();cancelSwap();rr();
      if(currentRoom){rooms.find(x=>x.id===currentRoom.id)?rmg(currentRoom):closeRoomDetail()}
    });

    // 拖入
    let ht=null;
    cd.ondragover=function(e){e.preventDefault();cd.classList.add('drag-hover');
      if(!cd.querySelector('.hover-tip')){const tp=document.createElement('div');tp.className='hover-tip';tp.textContent='⏳ 停留1秒';cd.appendChild(tp)}
      if(ht)clearTimeout(ht);ht=setTimeout(function(){openRoomDetail(r);const tp=cd.querySelector('.hover-tip');if(tp){tp.textContent='✅ 已展开';tp.classList.add('success')}},1000)};
    cd.ondragleave=function(){cd.classList.remove('drag-hover');if(ht){clearTimeout(ht);ht=null}const tp=cd.querySelector('.hover-tip');if(tp)tp.remove()};
    cd.ondrop=function(e){e.preventDefault();cd.classList.remove('drag-hover');if(ht){clearTimeout(ht);ht=null}const tp=cd.querySelector('.hover-tip');if(tp)tp.remove()};
    g.appendChild(cd);
  });
  upd();
}
function cancelSwap(){swapSrc=null;document.body.classList.remove('swap-mode');document.querySelectorAll('.room-card').forEach(c=>c.classList.remove('swap-source','swap-target'));document.getElementById('emptyHint').textContent='💡 双击改名 · 长按互换 · 拖物品进房间'}

function rf(){
  const b=document.getElementById('floatingBar'),t=document.getElementById('floatingTrack');t.innerHTML='';
  if(!floatingItems.length){b.style.display='none';document.getElementById('emptyHint').style.display='block';return}
  b.style.display='block';document.getElementById('emptyHint').style.display='none';
  floatingItems.concat(floatingItems).forEach(function(item){
    const tag=document.createElement('span');tag.className='item-tag';tag.draggable=true;
    tag.innerHTML='<span class="icon">'+item.icon+'</span>'+item.name+'<span class="close" onclick="event.stopPropagation();rmvF(\''+item.id+'\')">✕</span>';
    tag.ondragstart=function(e){draggedItemData={name:item.name,icon:item.icon,id:item.id};e.dataTransfer.setData('text/plain',JSON.stringify(draggedItemData));tag.classList.add('dragging')};
    tag.ondragend=function(){tag.classList.remove('dragging')};t.appendChild(tag);
  });
}
function rmvF(id){pa(function(){floatingItems=floatingItems.filter(function(f){return f.id!==id})})}
function addF(name,icon){floatingItems.push({id:'f'+Date.now(),name,icon:icon||'📦'});rf();sv()}

function openRoomDetail(room){
  if(currentRoom&&currentRoom.id===room.id)return;
  currentRoom=room;document.getElementById('roomDetailWrap').style.display='block';
  document.getElementById('detailRoomName').textContent=room.icon+' '+room.name;rmg(room);
  document.querySelectorAll('.room-card').forEach(function(c,i){c.classList.toggle('active',i<rooms.length&&rooms[i].id===room.id)});
  setTimeout(function(){document.getElementById('roomDetailWrap').scrollIntoView({behavior:'smooth',block:'nearest'})},100);
}
function closeRoomDetail(){document.getElementById('roomDetailWrap').style.display='none';currentRoom=null;document.querySelectorAll('.room-card').forEach(function(c){c.classList.remove('active')})}

function rmg(room){
  const map=document.getElementById('gridMap');map.innerHTML='';const data=storage[room.id]||{};
  CL.forEach(function(label){
    const cell=document.createElement('div');const item=data[label];
    cell.className='grid-cell'+(item?' full':'');
    if(item)cell.innerHTML='<span class="cell-label">'+label+'</span><div class="cell-item"><span class="emoji">'+item.icon+'</span>'+item.name+'</div><span class="remove-item" onclick="event.stopPropagation();rmvI(\''+room.id+'\',\''+label+'\')">✕</span>';
    else cell.innerHTML='<span class="cell-label">'+label+'</span>';
    cell.ondragover=function(e){e.preventDefault();cell.classList.add('drag-over')};
    cell.ondragleave=function(){cell.classList.remove('drag-over')};
    cell.ondrop=function(e){e.preventDefault();cell.classList.remove('drag-over');if(!draggedItemData)return;
      pa(function(){if(!storage[room.id])storage[room.id]={};storage[room.id][label]={name:draggedItemData.name,icon:draggedItemData.icon||'📦'};floatingItems=floatingItems.filter(function(f){return f.id!==draggedItemData.id});draggedItemData=null})};
    if(!item)cell.onclick=function(){const n=prompt('物品名称：');if(n&&n.trim()){pa(function(){if(!storage[room.id])storage[room.id]={};storage[room.id][label]={name:n.trim(),icon:'📦'}})}};
    map.appendChild(cell);
  });
}
function rmvI(roomId,label){if(!confirm('确定移出？'))return;pa(function(){if(storage[roomId]){delete storage[roomId][label];if(!Object.keys(storage[roomId]).length)delete storage[roomId]}})}
function upd(){let t=0;rooms.forEach(function(r){const c=storage[r.id]?Object.keys(storage[r.id]).length:0;t+=c});document.getElementById('totalItems').textContent=t}

function searchItems(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('.room-card').forEach(function(card,i){
    if(i<rooms.length){const r=rooms[i];const d=storage[r.id]||{};let f=0;if(q)for(let k in d){if(d[k].name.toLowerCase().includes(q)){f=1;break}}card.dataset.highlight=f?'true':'false'}
  });
}

function openAddModal(){
  document.getElementById('modal').classList.add('show');
  document.getElementById('newItemName').value='';document.getElementById('newItemIcon').value='';
  const sel=document.getElementById('newItemRoom');sel.innerHTML='';
  rooms.forEach(function(r){const o=document.createElement('option');o.value=r.id;o.textContent=r.icon+' '+r.name;sel.appendChild(o)});
  if(currentRoom)sel.value=currentRoom.id;updCell();sel.onchange=updCell;
}
function updCell(){const rid=document.getElementById('newItemRoom').value,data=storage[rid]||{},cs=document.getElementById('newItemCell');cs.innerHTML='';CL.forEach(function(l){if(!data[l]){const o=document.createElement('option');o.value=l;o.textContent=l;cs.appendChild(o)}})}
function closeAddModal(){document.getElementById('modal').classList.remove('show')}
function confirmAdd(){
  const n=document.getElementById('newItemName').value.trim(),rid=document.getElementById('newItemRoom').value,cl=document.getElementById('newItemCell').value,ic=document.getElementById('newItemIcon').value.trim()||'📦';
  if(!n){alert('请输入名称');return}if(!storage[rid])storage[rid]={};storage[rid][cl]={name:n,icon:ic};
  addF(n,ic);closeAddModal();if(currentRoom&&currentRoom.id===rid)rmg(currentRoom);upd();
}
function shareToFamily(){alert('👨‍👩‍👧 分享给家人\n\n后续接入云端可实现数据多端同步')}

init();
</script>
</body>
</html>
